# Firebase App Hosting config for the FINO JEWELLERY website.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# This file lives in the `website` folder, which is the backend's "Root directory".
# Plain `value`s are visible to everyone with access to the repo/project, so only
# public settings go here. Everything secret is stored in Cloud Secret Manager:
#   firebase apphosting:secrets:set <secretName>
# (say "Yes" when it asks to grant access to your backend).

runConfig:
  minInstances: 0   # scales to zero when nobody visits (cheapest)
  maxInstances: 2   # raise later if traffic grows
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # --- Public settings (safe in Git) ---------------------------------------
  # Your live address. Change to your custom domain once it's connected,
  # e.g. https://finojewellery.com — used for SEO links, sitemap and sharing.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://REPLACE-WITH-YOUR-APP-HOSTING-URL
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    value: 2b5hsmi7
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SANITY_DATASET
    value: production
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SANITY_API_VERSION
    value: "2026-10-01"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_RECAPTCHA_VERSION
    value: v2
    availability: [BUILD, RUNTIME]

  # --- Secrets (stored in Cloud Secret Manager, never in Git) ---------------
  # reCAPTCHA site key is technically public, but kept as a secret so you
  # don't have to commit it.
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    secret: recaptchaSiteKey
    availability: [BUILD, RUNTIME]
  - variable: RECAPTCHA_SECRET_KEY
    secret: recaptchaSecretKey
  - variable: SANITY_API_WRITE_TOKEN
    secret: sanityWriteToken
  - variable: SANITY_REVALIDATE_SECRET
    secret: sanityRevalidateSecret

  # Optional — uncomment ONLY after creating the secret, otherwise the build fails.
  # - variable: RESEND_API_KEY
  #   secret: resendApiKey
  # - variable: CONTACT_TO_EMAIL
  #   value: you@example.com
  # - variable: CONTACT_FROM_EMAIL
  #   value: "FINO Website <enquiries@yourdomain.com>"
